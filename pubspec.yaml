name: flutter_app
description: MedCases PRO - App médico clínico com cockpit, calculadora de doses, protocolos de emergência e IA clínica.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: 6.1.5+1

  # Local storage (fallback offline)
  shared_preferences: 2.5.3

  # HTTP
  http: 1.5.0

  # URL launcher (web navigation)
  url_launcher: 6.3.1

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase — versões fixas testadas com Flutter 3.35.4
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  share_plus: ^12.0.2

  # Firebase Storage — upload de PDFs (Biblioteca Clínica)
  firebase_storage: 12.3.2

  # File picker — selecionar PDFs no web/mobile
  file_picker: 8.1.7

  # Google Sign-In OAuth (Gemini via conta Google)
  google_sign_in: 6.2.1

  # Text-to-Speech (respostas da IA em áudio — web + mobile)
  flutter_tts: 4.2.0

  # Armazenamento seguro de tokens (Keychain iOS / Keystore Android)
  # flutter_secure_storage: 9.2.2  # mobile-only — não usar no Web

  # Notificações locais (mobile-only — não usar no Web)
  # flutter_local_notifications: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
