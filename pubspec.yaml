name: medcases
description: "MedCases Pro"
publish_to: 'none'
version: 6.1.5+1641

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: 6.1.5+1

  # Local storage (fallback offline)
  shared_preferences: 2.5.3

  # HTTP
  http: 1.5.0

  # URL launcher (web navigation)
  url_launcher: 6.3.1

  # WebView — renderiza páginas web in-app com User-Agent customizado
  # Usado por CalculadoraScreen para carregar promedcases.com/calculadoras
  # com header 'MedCasesApp/6.1.0' que desativa o bloqueio da página.
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.18.5
  # BUILD 283: dependência direta necessária para AndroidWebViewControllerCreationParams
  # (allowFileAccess + allowFileAccessFromFileURLs) — resolve net::ERR_ACCESS_DENIED
  # ao carregar arquivo offline (file://) da CalculadoraScreen no Android.
  webview_flutter_android: 4.10.0

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase — versões fixas testadas com Flutter 3.35.4
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  share_plus: ^12.0.2

  # Firebase Storage — upload de PDFs (Biblioteca Clínica)
  firebase_storage: 12.3.2

  # Firebase Cloud Functions — BUILD 459: chamada da CF atenderConsultaIA
  # onCall v2 via AiEngineService._dispatchViaCloudFunction (kUseCloudFunctions=true)
  cloud_functions: ^5.0.0

  # Firebase Messaging — FCM push notifications (PARTE 5 BUILD 238)
  # Admin push to admins on new user registration + deep-link to Notifications tab
  firebase_messaging: 15.1.3

  # File picker — selecionar PDFs no web/mobile
  file_picker: 8.1.7
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Google Sign-In OAuth (Gemini via conta Google)
  google_sign_in: 6.2.1

  # Text-to-Speech (respostas da IA em áudio — web + mobile)
  flutter_tts: 4.2.0

  # Speech-to-Text nativo iOS/Android + Web Speech API fallback
  speech_to_text: ^7.4.0
  printing: ^5.14.3

  # Armazenamento seguro de tokens (Keychain iOS / Keystore Android)
  # flutter_secure_storage: 9.2.2  # mobile-only — não usar no Web

  # Notificações locais (mobile-only — não usar no Web)
  flutter_local_notifications: ^18.0.1

  # Timezone para agendamentos precisos com flutter_local_notifications
  timezone: ^0.10.0

  # Markdown renderer — renderiza respostas da IA com hierarquia visual nativa
  # Usado por _AiBubble (Build 116) para bloco único contínuo sem fragmentação
  flutter_markdown: ^0.7.7

  # Imagens de capa das guias PDF — cache eficiente em web + mobile
  # Build 169: GuideModel.coverUrl → thumbnail dinâmico no _GuideCard
  cached_network_image: ^3.4.1

  # Local file storage — getApplicationSupportDirectory() para calculator offline cache
  # BUILD 240: OfflineCalculatorCacheService salva arquivos da calculadora localmente
  path_provider: ^2.1.5

  # BUILD 280: sincroniza o splash nativo do iOS (LaunchScreen.storyboard) com o
  # primeiro frame real do Flutter, eliminando o "blink/flash" de aprovação da App Store.
  # FlutterNativeSplash.preserve() → mantém storyboard ativo durante o boot assíncrono
  # FlutterNativeSplash.remove()   → descarta storyboard APÓS o frame Flutter estar pronto
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#0F1116"
  image: assets/icon/app_icon.png
  color_dark: "#0F1116"
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    icon_background_color: "#0F1116"
    image_dark: assets/icon/app_icon.png
    icon_background_color_dark: "#0F1116"
  fullscreen: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
