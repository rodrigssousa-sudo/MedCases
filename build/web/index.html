<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MedCases Pro — Apoio clínico educacional para médicos e estudantes de medicina.">

  <!-- iOS / Safari meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedCases Pro">
  <meta name="theme-color" content="#07110d">

  <!-- Apple touch icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MedCases Pro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #07110d;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #07110d;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #075f45, #07110d);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #loading-logo span {
      color: #FFE8A6;
      font-size: 32px;
      font-weight: 900;
      font-family: serif;
    }
    #loading-text {
      color: #C5A365;
      font-size: 18px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.5px;
    }
    #loading-sub {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin-top: 6px;
    }
    #loading-spinner {
      margin-top: 32px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(197,163,101,0.2);
      border-top-color: #C5A365;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Garante que o canvas Flutter fique visível */
    flt-glass-pane, flutter-view {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div id="loading-logo"><span>M</span></div>
    <div id="loading-text">MedCases Pro</div>
    <div id="loading-sub">Apoio clínico educacional</div>
    <div id="loading-spinner"></div>
  </div>

  <script>
    // ── Função central para remover a loading screen ──────────────────────
    var _loadingRemoved = false;
    function removeLoading() {
      if (_loadingRemoved) return;
      _loadingRemoved = true;
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(function() {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 450);
    }

    // ── Estratégia 1: evento oficial do Flutter ───────────────────────────
    window.addEventListener('flutter-first-frame', removeLoading);

    // ── Estratégia 2: MutationObserver — detecta quando Flutter insere o canvas
    var observer = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          var n = nodes[j];
          if (n.tagName && (
            n.tagName.toLowerCase() === 'flt-glass-pane' ||
            n.tagName.toLowerCase() === 'flutter-view' ||
            n.tagName.toLowerCase() === 'canvas'
          )) {
            setTimeout(removeLoading, 300);
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // ── Estratégia 3: fallback por timeout (10s) ─────────────────────────
    // Se Flutter não disparar nenhum evento em 10s, remove a loading screen
    // para não deixar o usuário preso (Safari pode engolir eventos)
    setTimeout(function() {
      if (!_loadingRemoved) {
        console.warn('[MedCases] Flutter não disparou flutter-first-frame em 10s — forçando remoção da loading screen.');
        removeLoading();
      }
    }, 10000);

    // ── Desabilitar Service Worker no Safari para evitar cache stale ──────
    // Safari tem bugs conhecidos com SW + CanvasKit que causam tela presa
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isSafari || isIOS) {
      console.log('[MedCases] Safari/iOS detectado — desabilitando Service Worker.');
      // Sobrescreve serviceWorker.register para Safari (não usar SW)
      if ('serviceWorker' in navigator) {
        // Desregistra qualquer SW existente que possa ter ficado stale
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // ── Sobrescreve _flutter.loader.load para Safari: sem serviceWorker ───
    // Executado após flutter_bootstrap.js definir o loader
    (function patchFlutterLoader() {
      var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (!isSafari && !isIOS) return;

      // Aguarda o loader estar disponível
      var attempts = 0;
      var interval = setInterval(function() {
        attempts++;
        if (attempts > 50) { clearInterval(interval); return; }
        if (window._flutter && window._flutter.loader) {
          clearInterval(interval);
          var originalLoad = window._flutter.loader.load.bind(window._flutter.loader);
          window._flutter.loader.load = function(config) {
            // Remove serviceWorkerSettings para Safari
            var safariConfig = Object.assign({}, config || {});
            delete safariConfig.serviceWorkerSettings;
            console.log('[MedCases] Safari: carregando Flutter sem Service Worker.');
            return originalLoad(safariConfig);
          };
        }
      }, 50);
    })();
  </script>

</body>
</html>
