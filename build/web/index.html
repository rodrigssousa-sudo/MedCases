  <!-- ═══════════════════════════════════════════════════════════════════
       LOCALSTORAGE HELPERS — criados ANTES do Firebase/SES lockdown.
       O Firebase Auth injeta lockdown-install.js que congela proxies do
       dart:js, tornando context['localStorage'].callMethod() inoperante.
       eval() era a workaround anterior, mas CSP em produção bloqueia eval.
       Solução: expor funções nativas no window ANTES do lockdown ser aplicado.
       Dart chama window.mcLsGet / mcLsSet / mcLsRemove via callMethod normal.
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      var _ls = window.localStorage;
      var _ss = window.sessionStorage;
      window.mcLsGet    = function(k)    { try { return _ls.getItem(k);    } catch(e) { return null; } };
      window.mcLsSet    = function(k, v) { try { _ls.setItem(k, v);        } catch(e) {} };
      window.mcLsRemove = function(k)    { try { _ls.removeItem(k);        } catch(e) {} };
      // sessionStorage — fallback para Safari ITP (mantém valores no redirect OAuth)
      window.mcSsGet    = function(k)    { try { return _ss.getItem(k);    } catch(e) { return null; } };
      window.mcSsSet    = function(k, v) { try { _ss.setItem(k, v);        } catch(e) {} };
      window.mcSsRemove = function(k)    { try { _ss.removeItem(k);        } catch(e) {} };
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════
       FIRESTORE REST AUTH INTERCEPTOR — XHR + fetch
       Dart's http package usa XMLHttpRequest (XHR), não window.fetch.
       O código compilado (main.dart.js / avE()) chama:
         A.oG(url, null).hE(...)  →  XHR GET sem Authorization header.
       Este interceptor patcha AMBOS os transportes antes do Flutter bootar:
         1. XMLHttpRequest.prototype.open  — captura a URL alvo
         2. XMLHttpRequest.prototype.send  — injeta Authorization síncrono
            via token cacheado (sem await; XHR.send é síncrono neste ponto)
         3. window.fetch                  — fallback para libs que usam fetch
       Funciona em Chrome, Firefox e Safari (iOS/macOS).
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
  (function() {
    'use strict';

    // ── Token cache ──────────────────────────────────────────────────────────
    // TTL de 55 minutos (tokens Firebase expiram em 60min)
    var _cachedToken = null;
    var _tokenExpiry = 0;
    var _tokenFetchInFlight = null;

    // Exposto para o Dart registrar o token logo após login (via js_interop)
    window.mcSetFirestoreToken = function(token, expiresInSeconds) {
      _cachedToken = token || null;
      _tokenExpiry = token ? (Date.now() + ((expiresInSeconds || 3300) * 1000)) : 0;
    };

    // Retorna o token cacheado se válido, senão tenta via Firebase compat SDK.
    // BLINDAGEM: verifica que firebase.apps.length > 0 (SDK inicializado) antes
    // de chamar firebase.auth() — evita TypeError: Cannot read properties of
    // undefined (reading 'INTERNAL') quando o compat SDK ainda está carregando.
    function _isFirebaseReady() {
      try {
        var fb = window.firebase;
        // firebase.apps só existe após firebase-app-compat.js executar;
        // firebase.auth só existe após firebase-auth-compat.js executar.
        // firebase.apps.length > 0 confirma que initializeApp() foi chamado.
        return !!(fb && fb.apps && fb.apps.length > 0 && typeof fb.auth === 'function');
      } catch(e) { return false; }
    }

    function _getFirebaseToken() {
      if (_tokenFetchInFlight) return _tokenFetchInFlight;
      if (_cachedToken && Date.now() < (_tokenExpiry - 30000)) {
        return Promise.resolve(_cachedToken);
      }
      _tokenFetchInFlight = (function() {
        try {
          // GUARD: Firebase compat SDK ainda não inicializou — não chamar auth()
          if (!_isFirebaseReady()) return Promise.resolve(_cachedToken);
          var auth = window.firebase.auth();
          var user = auth && auth.currentUser;
          if (!user || typeof user.getIdToken !== 'function') return Promise.resolve(_cachedToken);
          return user.getIdToken(false).then(function(tok) {
            if (tok) { _cachedToken = tok; _tokenExpiry = Date.now() + 55 * 60 * 1000; }
            return tok || null;
          }).catch(function() { return _cachedToken; });
        } catch(e) {
          // Silencia qualquer TypeError do SDK compat em inicialização
          console.warn('[MedCases] _getFirebaseToken: SDK não pronto —', e && e.message);
          return Promise.resolve(_cachedToken);
        }
      })().then(function(tok) { _tokenFetchInFlight = null; return tok; },
                function()    { _tokenFetchInFlight = null; return _cachedToken; });
      return _tokenFetchInFlight;
    }

    // Retorna token SINCRONAMENTE do cache (usado pelo XHR interceptor no send)
    function _getCachedToken() {
      if (_cachedToken && Date.now() < (_tokenExpiry - 30000)) return _cachedToken;
      // Dispara refresh assíncrono apenas se Firebase já está pronto
      if (_isFirebaseReady()) _getFirebaseToken();
      return _cachedToken;
    }

    function _isFirestoreUrl(url) {
      return url && url.indexOf('firestore.googleapis.com') !== -1;
    }

    // ── 1. XHR interceptor ───────────────────────────────────────────────────
    // Dart's http package usa XHR internamente. Precisamos interceptar
    // XMLHttpRequest.prototype.open (para guardar a URL) e
    // XMLHttpRequest.prototype.setRequestHeader (para detectar se Authorization
    // já foi definido) e XMLHttpRequest.prototype.send (para injetar o header).
    (function() {
      var _origOpen  = XMLHttpRequest.prototype.open;
      var _origSetRH = XMLHttpRequest.prototype.setRequestHeader;
      var _origSend  = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function(method, url) {
        // Guarda metadata no objeto XHR para uso no send()
        this._mcMethod  = (method || '').toUpperCase();
        this._mcUrl     = url || '';
        this._mcHasAuth = false;
        return _origOpen.apply(this, arguments);
      };

      XMLHttpRequest.prototype.setRequestHeader = function(name, value) {
        // Detecta se Authorization já foi definido pelo chamador
        if (name && (name.toLowerCase() === 'authorization')) {
          this._mcHasAuth = true;
        }
        return _origSetRH.apply(this, arguments);
      };

      XMLHttpRequest.prototype.send = function(body) {
        var url    = this._mcUrl    || '';
        var method = this._mcMethod || '';

        // ESCOPO RESTRITO: só intercepta GET /public_histories sem Authorization.
        // clinical_guides, app_config, app_updates e qualquer outro endpoint
        // passam direto — sem delay, sem modificação.
        var isPublicHistoriesGet = (method === 'GET')
          && _isFirestoreUrl(url)
          && url.indexOf('public_histories') !== -1
          && !this._mcHasAuth;

        if (isPublicHistoriesGet) {
          var xhr = this;
          console.log('[MedCases XHR] public_histories GET sem auth — aguardando token 3s', '| url:', url);
          // Aguarda token com timeout 3s
          Promise.race([
            _getFirebaseToken(),
            new Promise(function(resolve) { setTimeout(resolve, 3000, null); })
          ]).then(function(token) {
            if (token) {
              console.log('[MedCases XHR] ✅ token → injetando Authorization | url:', url);
              try { _origSetRH.call(xhr, 'Authorization', 'Bearer ' + token); } catch(e) {}
              try { _origSend.call(xhr, body); } catch(e) {}
            } else {
              console.warn('[MedCases XHR] ⚠️ sem token 3s — enviando sem auth (allow read: if true) | url:', url);
              try { _origSend.call(xhr, body); } catch(e) {}
            }
          }).catch(function(err) {
            console.warn('[MedCases XHR] ⚠️ token error — enviando sem auth | err:', err);
            try { _origSend.call(xhr, body); } catch(e) {}
          });
          return; // async — _origSend chamado dentro do .then()
        }

        // Tudo mais (clinical_guides, SDK listen, app_config, etc.) → passa direto
        return _origSend.apply(this, arguments);
      };
    })();

    // ── 2. fetch interceptor — ESCOPO: public_histories sem token APENAS ────────
    // IMPORTANTE: qualquer outro endpoint Firestore (clinical_guides, app_config,
    // SDK gRPC/listen, etc.) passa COMPLETAMENTE INTOCADO — sem delay, sem await.
    // O interceptor NÃO adiciona nem remove headers de outras URLs.
    var _origFetch = window.fetch;
    window.fetch = async function(input, init) {
      var url = typeof input === 'string'
        ? input
        : (input && typeof input.url === 'string' ? input.url : String(input));
      var method = (init && init.method) || (input && input.method) || 'GET';

      // Só intercepta GET para public_histories sem Authorization já presente.
      // Tudo o mais (clinical_guides, app_config, SDK listen, PATCH, POST...) → direto.
      var isPublicHistoriesGet = method.toUpperCase() === 'GET'
        && _isFirestoreUrl(url)
        && url.indexOf('public_histories') !== -1;

      if (!isPublicHistoriesGet) {
        return _origFetch.apply(this, arguments);
      }

      // Verifica se Authorization já presente — se sim, passa direto
      var hasAuth = false;
      try {
        var h = init && init.headers;
        if (h) {
          hasAuth = !!(h instanceof Headers
            ? h.get('authorization')
            : (h['Authorization'] || h['authorization']));
        }
      } catch(e) {}
      if (hasAuth) {
        return _origFetch.apply(this, arguments);
      }

      console.log('[Fetch] public_histories GET sem auth — aguardando token 3s | url:', url);

      // Aguarda token com timeout 3s
      var token = await Promise.race([
        _getFirebaseToken(),
        new Promise(function(resolve) { setTimeout(resolve, 3000, null); })
      ]);

      if (token) {
        console.log('[Fetch] ✅ token obtido — injetando Authorization | url:', url);
        var newInit = {};
        if (init) {
          for (var k in init) {
            if (Object.prototype.hasOwnProperty.call(init, k)) newInit[k] = init[k];
          }
        }
        var existingH = newInit.headers || {};
        var newH = {};
        try {
          if (existingH instanceof Headers) {
            existingH.forEach(function(v, hk) { newH[hk] = v; });
          } else {
            for (var hk in existingH) {
              if (Object.prototype.hasOwnProperty.call(existingH, hk)) newH[hk] = existingH[hk];
            }
          }
        } catch(e) {}
        newH['Authorization'] = 'Bearer ' + token;
        newInit.headers = newH;
        return _origFetch.call(window, input, newInit);
      }

      // Sem token após 3s → passa sem auth (allow read: if true nas rules)
      console.warn('[Fetch] ⚠️ sem token 3s — enviando sem auth (public_histories allow read: if true) | url:', url);
      return _origFetch.apply(window, arguments);
    };

  })();
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════
       SAFETY NET: captura erros não tratados do código compilado antigo.
       O avE() em main.dart.js lança "REST public_histories: HTTP 403"
       via throw se o XHR retornar != 200. Com o XHR interceptor, o token
       já é injetado antes do send() e o 403 não deve mais ocorrer.
       Este handler é a última linha de defesa: silencia o erro para evitar
       tela cinza caso algum edge case ainda produza um rejection não capturado.
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var msg = (reason && (reason.message || String(reason))) || '';
    // Captura apenas o erro específico do fetch interceptor (bloqueio controlado)
    // Não suprime erros genéricos de public_histories — eles devem aparecer no console
    if (msg.indexOf('Blocked by MedCases Fetch Interceptor') !== -1) {
      event.preventDefault();
      console.warn('[MedCases] Fetch bloqueado (sem token) — nenhuma requisição zumbi enviada:', msg);
    }
  });
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════
       GOOGLE SIGN-IN SDK

  <!-- ═══════════════════════════════════════════════════════════════════
       FIREBASE — carregado APÓS o primeiro frame (não compete com boot)
  ═══════════════════════════════════════════════════════════════════ -->
  <script>
    window._firebaseLoaded = false;
    function _loadFirebase() {
      if (window._firebaseLoaded) return;
      window._firebaseLoaded = true;

      // CARREGAMENTO SEQUENCIAL (app → auth → firestore).
      // Carregar em paralelo com async puro causa race condition:
      //   firebase-auth-compat.js tenta acessar firebase.INTERNAL antes
      //   de firebase-app-compat.js terminar → TypeError: Cannot read
      //   properties of undefined (reading 'INTERNAL').
      // Solução: cada script dispara o próximo no onload.
      var urls = [
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js'
      ];

      function loadNext(i) {
        if (i >= urls.length) return;
        var s = document.createElement('script');
        s.src = urls[i];
        s.async = false;  // garante execução em ordem quando injetado
        s.onload = function() { loadNext(i + 1); };
        s.onerror = function() {
          console.error('[MedCases] Falha ao carregar Firebase compat:', urls[i]);
          loadNext(i + 1); // continua mesmo em caso de falha de rede
        };
        document.head.appendChild(s);
      }

      loadNext(0);
    }
    // Carrega Firebase compat SDK o mais cedo possível:
    // - Após o primeiro frame do Flutter (prioridade normal)
    // - Fallback em 3s se flutter-first-frame não disparar (Safari PWA)
    // - Fallback adicional em 8s para garantia
    window.addEventListener('flutter-first-frame', function() { setTimeout(_loadFirebase, 100); });
    setTimeout(_loadFirebase, 3000);  // fallback Safari PWA
    setTimeout(_loadFirebase, 8000);  // fallback de segurança
  </script>

  <!-- ═════════════════════════════════════════════════════════════════
       SCRIPT PRINCIPAL — SW + Boot Flutter
  ═════════════════════════════════════════════════════════════════ -->
  <script>
    'use strict';

    // ── Versão do app (alterar a cada deploy significativo) ──────────
    // ── Limpa parâmetros de cache-bust da URL (não acumular) ──────────
    (function() {
      try {
        var url = new URL(window.location.href);
        var changed = false;
        if (url.searchParams.has('bust'))    { url.searchParams.delete('bust');    changed = true; }
        if (url.searchParams.has('nocache')) { url.searchParams.delete('nocache'); changed = true; }
        if (changed) {
          var clean = url.pathname + (url.search || '') + (url.hash || '');
          history.replaceState(null, '', clean);
        }
      } catch(e) {}
    })();

    // ── ANTI-LOOP: detecta redirect em loop e boota direto ──────────
    // sessionStorage é limpo ao fechar aba, não persiste entre sessões.
    // Se detectar 2+ reloads rápidos (< 4s), mata SWs/caches e boota direto.
    (function() {
      try {
        var _now = Date.now();
        var _rc = parseInt(sessionStorage.getItem('_mc_rc') || '0', 10);
        var _rt = parseInt(sessionStorage.getItem('_mc_rt') || '0', 10);
        sessionStorage.setItem('_mc_rt', String(_now));
        sessionStorage.setItem('_mc_rc', String((_now - _rt < 4000) ? _rc + 1 : 0));
        if (_rc >= 2) {
          sessionStorage.setItem('_mc_rc', '0');
          try { localStorage.setItem('medcases_app_version', '6.1.0-build116'); } catch(e2) {}
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function(r) { r.forEach(function(s) { s.unregister(); }); })
              .catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(ks) { ks.forEach(function(k) { caches.delete(k); }); })
              .catch(function() {});
          }
          window._mcEmergencyBoot = true;
        }
      } catch(e) {}
    })();

    var APP_VERSION = '6.2.8-build146';
    var SW_URL      = 'pwa-sw.js?v=6.1.7-build137';

    // ── Remoção do splash ────────────────────────────────────────────
    var _splashRemoved = false;
    function removeSplash() {
      if (_splashRemoved) return;
      _splashRemoved = true;
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(function() {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 420);
    }

    window.addEventListener('flutter-first-frame', removeSplash);

    // Observer como fallback — detecta quando Flutter monta o DOM
    var _obs = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          var n = nodes[j];
          if (n.tagName) {
            var tag = n.tagName.toLowerCase();
            if (tag === 'flt-glass-pane' || tag === 'flutter-view' || tag === 'flt-scene-host') {
              setTimeout(removeSplash, 150);
              _obs.disconnect();
              return;
            }
          }
        }
      }
    });
    _obs.observe(document.body, { childList: true, subtree: true });
    // Timeout de segurança: remove splash após 15s em qualquer caso
    setTimeout(function() { if (!_splashRemoved) removeSplash(); }, 15000);

    // ── Boot do Flutter ──────────────────────────────────────────────
    function bootFlutter() {
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.head.appendChild(s);
    }

    // A2HS removido — banner de instalação desativado
    // Suprime o mini-banner nativo do Chrome sem exibir nada
    window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); });

    // ── Google OAuth — Redirect Flow (funciona em Safari iOS) ────────
    // requestToken() e popups cross-origin são bloqueados pelo Safari iOS.
    // SOLUÇÃO DEFINITIVA: redirect flow — redireciona para accounts.google.com
    // na MESMA aba. Google redireciona de volta com #access_token na URL.
    // Funciona em 100% dos browsers sem popup.
    (function() {
      var CLIENT_ID = '1076800980330-mpq75ceph6hipht135qt0g505pdu5u7d.apps.googleusercontent.com';
      // Scope apenas email — sem scope restrito generative-language.retriever.
      // O Gemini é chamado via API Key (campo 'key' na URL), não OAuth token.
      // Isso elimina o erro 403 access_denied para usuários não-Test.
      var SCOPE     = 'email';
      // URI fixa — deve coincidir EXATAMENTE com o que está no Google Cloud Console
      // Authorized redirect URIs. Não usar window.location para evitar variações
      // de pathname (trailing slash, sub-rotas, etc.) que causam redirect_uri_mismatch.
      var REDIRECT  = 'https://medcasespro.com/';

      // ── Decodifica email do JWT id_token (sem fetch, 100% síncrono) ──────
      // O id_token é um JWT base64url-encoded. O payload (parte central) contém
      // o campo "email" diretamente. Decodificar é seguro — apenas leitura.
      function _decodeJwtEmail(idToken) {
        try {
          var parts = idToken.split('.');
          if (parts.length !== 3) return null;
          // base64url → base64 (substitui - por + e _ por /)
          var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
          // Padding para múltiplo de 4
          while (b64.length % 4) b64 += '=';
          var payload = JSON.parse(atob(b64));
          return payload.email || null;
        } catch(e) { return null; }
      }

      // ── Salva em localStorage E sessionStorage (Safari ITP fallback) ─────
      // Safari ITP pode bloquear localStorage em contexto de redirect cross-origin.
      // sessionStorage sobrevive ao redirect dentro da mesma aba e é sempre acessível.
      function _safeSave(key, value) {
        try { localStorage.setItem(key, value); } catch(e) {}
        try { sessionStorage.setItem(key, value); } catch(e) {}
      }
      function _safeRead(key) {
        try {
          var v = localStorage.getItem(key);
          if (v) return v;
        } catch(e) {}
        try {
          var v2 = sessionStorage.getItem(key);
          if (v2) return v2;
          // Copia para localStorage se encontrou no sessionStorage
          // (garante persistência entre sessões)
          if (v2) { try { localStorage.setItem(key, v2); } catch(e2) {} }
          return v2;
        } catch(e) {}
        return null;
      }

      // ── 1. Verifica se voltou do redirect OAuth ──────────────────────────
      // Google retorna no hash: #access_token=...&id_token=...&token_type=Bearer&...
      (function _checkRedirectReturn() {
        var hash = window.location.hash;

        if (!hash || hash.indexOf('access_token') === -1) {
          return; // Sem redirect — boot normal
        }

        var params = {};
        hash.replace(/^#/, '').split('&').forEach(function(p) {
          var kv = p.split('=');
          if (kv.length === 2) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
        });

        var token   = params['access_token'];
        var idToken = params['id_token'];
        var error   = params['error'];

        // Limpa o hash da URL sem recarregar (antes de salvar — evita loop)
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch(e) {}

        if (token) {
          // CRÍTICO: salva token E flag SINCRONAMENTE (localStorage + sessionStorage).
          _safeSave('gemini_access_token', token);
          _safeSave('medcases_gsi_pending', 'true');

          // ── Estratégia 1 (melhor): extrai email do id_token JWT — SÍNCRONO ──
          // Disponível imediatamente quando Flutter carrega, sem dependência de rede.
          if (idToken) {
            var emailFromJwt = _decodeJwtEmail(idToken);
            if (emailFromJwt) {
              _safeSave('gemini_google_email', emailFromJwt);
              // Email já salvo — Flutter vai encontrar ao iniciar checkGeminiSession
              return;
            }
          }

          // ── Estratégia 2 (fallback): fetch tokeninfo — assíncrono ────────────
          // Usado se id_token não estava presente no hash (fallback para implicit flow puro).
          // Pode demorar 200-800ms — checkGeminiSession tem delay de 1500ms para aguardar.
          fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + token)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d.email) {
                _safeSave('gemini_google_email', d.email);
              }
            })
            .catch(function() {});
        } else if (error) {
          // Redirect OAuth retornou erro (ex: access_denied) — limpa flags
          try { localStorage.removeItem('medcases_gsi_pending'); } catch(e) {}
          try { sessionStorage.removeItem('medcases_gsi_pending'); } catch(e) {}
        }
      }());

      // ── 2. Botão HTML onclick — redirect direto (Safari-safe) ────────────
      window._gsiHandleClick = function() {
        var url = 'https://accounts.google.com/o/oauth2/v2/auth'
          + '?client_id='     + encodeURIComponent(CLIENT_ID)
          + '&redirect_uri='  + encodeURIComponent(REDIRECT)
          // id_token + access_token no hash — email decodificável sem fetch de rede
          + '&response_type=' + encodeURIComponent('token id_token')
          + '&scope='         + encodeURIComponent('email openid')
          + '&prompt=select_account'
          + '&nonce='         + Math.random().toString(36).substring(2); // nonce obrigatório p/ id_token
        // Redirect na mesma aba — Safari nunca bloqueia window.location
        window.location.href = url;
      };

      // ── 3. API para o Flutter abrir o modal ──────────────────────────
      window.medcasesShowGSIModal = function() {
        var modal = document.getElementById('gsi-modal');
        if (modal) modal.classList.add('open');
        document.getElementById('gsi-status').textContent = '';
        // Sinaliza para o Flutter que o modal foi aberto (redirect em andamento).
        // connectGemini() lê esta flag para distinguir "redirect iniciado"
        // de "falha real" e retorna null em vez de false.
        try { localStorage.setItem('medcases_gsi_modal_opened', 'true'); } catch(e) {}
      };

      window._gsiClose = function() {
        var modal = document.getElementById('gsi-modal');
        if (modal) modal.classList.remove('open');
        window.dispatchEvent(new CustomEvent('medcases-gsi-token', {
          detail: { token: null, error: 'cancelled' }
        }));
      };

      document.getElementById('gsi-overlay').addEventListener('click', window._gsiClose);

      // Retrocompatibilidade
      window.medcasesGoogleSignIn = function() { window.medcasesShowGSIModal(); };

    }());

    // ── Força hard-reload quebrando cache HTTP (apenas para botão manual) ──
    // Usado SOMENTE pelo botão ATUALIZAR — nunca chamado automaticamente no boot.
    function _hardReload() {
      var ts = Date.now();
      var base = window.location.pathname;
      window.location.replace(base + '?nocache=' + ts);
    }

    // Expõe globalmente para o Flutter chamar via js_interop se necessário
    window.medcasesForceUpdate = _hardReload;

    // ── Toast de atualização ─────────────────────────────────────────
    var _waitingSW = null;

    function showUpdateToast(sw) {
      _waitingSW = sw;
      var toast = document.getElementById('pwa-update-toast');
      if (toast) toast.classList.add('show');
      // Auto-dismiss em 15s se usuário não interagir
      setTimeout(function() {
        if (toast) toast.classList.remove('show');
      }, 15000);
      // Notifica o Dart (Flutter) que há um update disponível.
      // O Dart registra window.onFlutterWebUpdateAvailable via dart:js_interop
      // (UpdateService.setupUpdateListener). Se ainda não foi registrado, a
      // flag _mcUpdatePending garante que o Dart seja notificado na próxima
      // chamada a setupUpdateListener.
      window._mcUpdatePending = true;
      try {
        if (typeof window.onFlutterWebUpdateAvailable === 'function') {
          window.onFlutterWebUpdateAvailable();
        }
      } catch(e) {}
    }

    // Aplica o update: envia SKIP_WAITING ao SW waiting e recarrega a página.
    // Chamado pelo Dart quando o usuário clica em "Atualizar Agora".
    // Fallback: se não há SW waiting, faz hard-reload quebrando cache.
    window.medcasesApplyUpdate = function() {
      try {
        window._mcUserTriggeredUpdate = true;
        if (_waitingSW && typeof _waitingSW.postMessage === 'function') {
          _waitingSW.postMessage({ type: 'SKIP_WAITING' });
          // controllerchange vai disparar → reload (listener acima o detecta).
          // Timeout de segurança: se controllerchange não disparar em 2s, recarrega.
          setTimeout(function() { window.location.reload(true); }, 2000);
        } else {
          // Sem SW waiting: hard-reload quebrando cache
          window.location.reload(true);
        }
      } catch(e) {
        window.location.reload(true);
      }
    };

      // Se anti-loop detectou ciclo, boota direto sem nenhuma lógica de SW

        bootFlutter();
        return;
      }

      if (!('serviceWorker' in navigator)) {
        bootFlutter();
        return;
      }

      window._mcUserTriggeredUpdate = false;

      // Botão ATUALIZAR: desregistra SWs + limpa caches + hard-reload com ?nocache
      document.getElementById('pwa-update-btn').addEventListener('click', function() {
        var toast = document.getElementById('pwa-update-toast');
        if (toast) toast.classList.remove('show');
        _userTriggeredUpdate = true;
        var swClean = navigator.serviceWorker.getRegistrations()
          .then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));

          ? caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() { return Promise.resolve(); })
          : Promise.resolve();
        Promise.all([swClean, cacheClean]).then(function() {
          _hardReload();
        });
      });

      // ── Detecção de versão nova — limpa SW/cache e boota ────────────
      var storedVersion = null;
      try { storedVersion = localStorage.getItem('medcases_app_version'); } catch(e) {}

      // ── BOOT IMEDIATO — Flutter inicia antes da limpeza de SW ────────────
      // Antes: bootFlutter() ficava dentro de Promise.all([swClean, cacheClean]).then()
      // Problema: qualquer lentidão no unregister/caches.delete travava o boot.
      // Fix: bootFlutter() é chamado SEMPRE de forma síncrona, e a limpeza
      // de SW/cache ocorre em paralelo no background, sem bloquear o Flutter.
      registerSW();
      bootFlutter();

      if (storedVersion !== APP_VERSION) {
        // Versão nova detectada: limpa SW + caches antigos EM PARALELO com o boot.
        // Flutter já está iniciando — limpeza não bloqueia mais a splash.
        var swClean = navigator.serviceWorker.getRegistrations()
          .then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          }).catch(function() {});

        var cacheClean = ('caches' in window)
          ? caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() {})
          : Promise.resolve();

        Promise.all([swClean, cacheClean])
          .catch(function() {})
          .then(function() {
            try { localStorage.setItem('medcases_app_version', APP_VERSION); } catch(e) {}
          });
      }

      function registerSW() {
        navigator.serviceWorker.register(SW_URL, {
          scope: '/',
          updateViaCache: 'none'
        })
        .then(function(reg) {

          // SW em waiting: só mostra toast se já há um controller ativo
          // (ou seja, é um UPDATE real, não o primeiro registro)
          if (reg.waiting && navigator.serviceWorker.controller) {
            showUpdateToast(reg.waiting);
          }

          // SW novo encontrado em background enquanto app está aberto
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              // Só mostra toast se: SW instalado + já havia um controller ativo
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateToast(newWorker);
              }
            });
          });

          // Verificação periódica de update a cada 30min
          setInterval(function() { reg.update().catch(function() {}); }, 30 * 60 * 1000);
        })
        .catch(function(err) {
          console.warn('[PWA] SW registration failed:', err);
        });
      }

    }());
