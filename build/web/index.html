<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MedCases Pro — Apoio clínico educacional para médicos e estudantes de medicina.">

  <!-- iOS / Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedCases Pro">
  <meta name="theme-color" content="#07110d">

  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MedCases Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pré-conectar ao CDN do Google antes de qualquer download -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Pré-carregar os recursos críticos de boot -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body {
      background-color: #07110d;
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #07110d;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading-logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #075f45, #07110d);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #loading-logo span { color: #FFE8A6; font-size: 32px; font-weight: 900; font-family: serif; }
    #loading-text { color: #C5A365; font-size: 18px; font-weight: 700; font-family: -apple-system, sans-serif; }
    #loading-sub  { color: rgba(255,255,255,0.4); font-size: 12px; font-family: -apple-system, sans-serif; margin-top: 6px; }
    #loading-spinner {
      margin-top: 32px; width: 32px; height: 32px;
      border: 3px solid rgba(197,163,101,0.2);
      border-top-color: #C5A365;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div id="loading-logo"><span>M</span></div>
    <div id="loading-text">MedCases Pro</div>
    <div id="loading-sub">Apoio clínico educacional</div>
    <div id="loading-spinner"></div>
  </div>

  <script>
    // ── Limpar SWs legados (sessões anteriores que ainda tenham SW em cache) ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) { caches.delete(key); });
        });
      }
    }

    // ── Loading screen: remove quando Flutter renderizar ─────────────────────
    var _loadingRemoved = false;
    function removeLoading() {
      if (_loadingRemoved) return;
      _loadingRemoved = true;
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 450);
    }

    window.addEventListener('flutter-first-frame', removeLoading);

    var _obs = new MutationObserver(function(mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          var n = nodes[j];
          if (n.tagName && (
            n.tagName.toLowerCase() === 'flt-glass-pane' ||
            n.tagName.toLowerCase() === 'flutter-view' ||
            n.tagName.toLowerCase() === 'canvas'
          )) {
            setTimeout(removeLoading, 200);
            _obs.disconnect();
            return;
          }
        }
      }
    });
    _obs.observe(document.body, { childList: true, subtree: true });

    // Fallback 20s
    setTimeout(function() {
      if (!_loadingRemoved) removeLoading();
    }, 20000);
  </script>

  <!-- flutter_bootstrap.js gerado com --pwa-strategy=none -->
  <!-- É o ÚNICO responsável por inicializar o Flutter. Não chamar loader.load() aqui. -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
