server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # Flutter SPA — todas as rotas servem index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de segurança compatíveis com Safari/iOS
        # REMOVIDO X-Frame-Options SAMEORIGIN (bloqueia embed no Safari)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content-Security-Policy Safari-compatible
        # Permite Firebase Auth, Firestore, Storage e FontsGoogle
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval'
                https://*.googleapis.com
                https://*.gstatic.com
                https://*.firebaseapp.com
                https://*.firebase.com
                https://apis.google.com;
            style-src 'self' 'unsafe-inline'
                https://fonts.googleapis.com;
            font-src 'self' data:
                https://fonts.gstatic.com;
            img-src 'self' data: blob:
                https://*.googleapis.com
                https://*.gstatic.com
                https://*.firebasestorage.app
                https://firebasestorage.googleapis.com;
            connect-src 'self'
                https://*.googleapis.com
                https://*.firebaseio.com
                https://*.firebaseapp.com
                https://firebase.googleapis.com
                https://firestore.googleapis.com
                https://identitytoolkit.googleapis.com
                https://securetoken.googleapis.com
                https://www.googleapis.com
                wss://*.firebaseio.com;
            worker-src 'self' blob:;
            child-src 'self' blob:;
            frame-src 'self'
                https://*.firebaseapp.com
                https://accounts.google.com;
            object-src 'none';
            base-uri 'self';
        " always;

        # CORS para Safari
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
    }

    # OPTIONS preflight (Safari faz preflight em algumas situações)
    location ~* \.(js|wasm|json)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type "text/plain charset=UTF-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Cache longo para assets imutáveis do Flutter
    location ~* \.(js|wasm|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # Não cachear index.html, service worker e manifest
    location ~* (index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Health check endpoint para o DigitalOcean
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"MedCases Pro"}';
        access_log off;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
    }
}
