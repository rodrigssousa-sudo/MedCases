server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Desativa ETags — evita que proxy/CDN use ETag antigo para 304 Not Modified
    etag off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml font/woff font/woff2;

    # ── Arquivos HTML e de boot do Flutter — NUNCA cachear ───────────────────
    # index.html, flutter_bootstrap.js, flutter_service_worker.js, etc.
    # Se ficarem em cache o browser executa código antigo → tela cinza
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|flutter\.js|version\.json)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "*" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── TODOS os arquivos .js — sem cache (cache-busting via ?v=HASH na URL) ─
    # Regra ampla: abrange main.dart.js, canvaskit.js, e qualquer chunk futuro.
    # O query param ?v=HASH injetado pelo build_web.sh garante URL única por deploy.
    # O CDN (Cloudflare) respeita Cache-Control: no-store mesmo em cache hit,
    # mas o query param é a garantia definitiva (URL diferente = cache miss forçado).
    location ~* \.js$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "*" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Arquivos WASM — sem cache ────────────────────────────────────────────
    location ~* \.wasm$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "*" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Assets imutáveis (fontes, imagens, ícones, CSS) ─────────────────────
    # Esses arquivos têm hash no nome gerado pelo Flutter — cache longo é seguro.
    location ~* \.(ttf|woff|woff2|png|jpg|jpeg|gif|ico|svg|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Deploy metadata — runtime identity descriptor (PILAR 3) ─────────────
    # Generated at container boot by docker/40-generate-deploy-meta.sh.
    # Exact-match (=) takes highest nginx priority — bypasses all regex blocks.
    # PROTECTION INVARIANT: PWA service workers must never cache this file.
    # Cache-Control: no-store prevents SW fetch interception and stale serving.
    location = /deploy_meta.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
        try_files $uri =404;
    }

    # ── SPA Flutter — todas as rotas → index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html nunca deve ser cacheado por CDN ou browser
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Vary "*" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS amplo — necessário para Firebase funcionar em todos browsers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

        # REMOVIDO: Cross-Origin-Opener-Policy + Cross-Origin-Embedder-Policy
        # Esses headers bloqueiam Firebase Auth no Safari/iOS mobile
        # COOP "same-origin" isola o contexto e impede Firebase de comunicar
        # COEP "credentialless" não é suportado pelo Safari → quebra requests
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"MedCases Pro"}';
        access_log off;
    }

    # ── Bloquear arquivos ocultos ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
    }
}
