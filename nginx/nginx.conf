server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml font/woff font/woff2;

    # ── Não cachear arquivos de boot do Flutter (evita tela presa) ──────────
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|flutter\.js)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Assets imutáveis do Flutter (JS compilado, WASM, fontes, imagens) ───
    location ~* \.(wasm|ttf|woff|woff2|png|jpg|jpeg|gif|ico|svg|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── main.dart.js — cache médio (muda a cada build) ──────────────────────
    location ~* main\.dart\.js$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── SPA Flutter — todas as rotas → index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Segurança básica (sem CSP restritiva — estava bloqueando CanvasKit)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS amplo para Safari/iOS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

        # Cross-Origin necessário para SharedArrayBuffer (CanvasKit/Skwasm)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # ── Health check ────────────────────────────────────────────────────────
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"MedCases Pro"}';
        access_log off;
    }

    # ── Bloquear arquivos ocultos ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
    }
}
