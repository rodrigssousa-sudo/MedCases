server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml font/woff font/woff2;

    # ── Arquivos de boot do Flutter — NUNCA cachear ──────────────────────────
    # flutter_bootstrap.js, flutter_service_worker.js, index.html, manifest.json
    # Se ficarem em cache o browser executa código antigo → tela cinza
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|flutter\.js|version\.json)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── main.dart.js — sem cache (muda a cada build) ─────────────────────────
    location ~* main\.dart\.js$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Assets imutáveis (fontes, imagens, ícones) ───────────────────────────
    location ~* \.(ttf|woff|woff2|png|jpg|jpeg|gif|ico|svg|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── WASM — sem cache longo (pode mudar entre builds) ─────────────────────
    location ~* \.wasm$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── SPA Flutter — todas as rotas → index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS amplo — necessário para Firebase funcionar em todos browsers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;

        # REMOVIDO: Cross-Origin-Opener-Policy + Cross-Origin-Embedder-Policy
        # Esses headers bloqueiam Firebase Auth no Safari/iOS mobile
        # COOP "same-origin" isola o contexto e impede Firebase de comunicar
        # COEP "credentialless" não é suportado pelo Safari → quebra requests
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","app":"MedCases Pro"}';
        access_log off;
    }

    # ── Bloquear arquivos ocultos ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
    }
}
