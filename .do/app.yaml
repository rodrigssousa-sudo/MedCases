# ══════════════════════════════════════════════════════════════════════════════
# Digital Ocean App Platform — MedCases Pro
# ══════════════════════════════════════════════════════════════════════════════
#
# Dois serviços na mesma App DO:
#   1. medcases-web    → nginx servindo Flutter Web estático (porta 8080)
#   2. ai-gateway      → Express.js AI Gateway SSE (porta 8080 interno → /api/*)
#
# Deploy:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# IMPORTANTE: GEMINI_API_KEY deve ser configurada como SECRET no painel DO,
#   exclusivamente no componente ai-gateway. Nunca coloque a chave no
#   componente web (medcases) — chaves de IA não pertencem ao bundle estático.
# ══════════════════════════════════════════════════════════════════════════════

name:   medcases-pro
region: nyc

services:

  # ── 1. Flutter Web — nginx estático ─────────────────────────────────────────
  - name: medcases
    github:
      repo:           rodrigssousa-sudo/MedCases
      branch:         main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port:       8080
    instance_count:  1
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path:              /health
      initial_delay_seconds:  10
      period_seconds:         30
      timeout_seconds:        5
      success_threshold:      1
      failure_threshold:      3

    routes:
      - path: /

    envs:
      - key:   FLUTTER_ENV
        value: production
        scope: RUN_TIME
      # DEPLOY_COMMIT: injected by DO App Platform at container boot time.
      # ${_self.COMMIT_HASH} is the official DO App Platform built-in token
      # that resolves to the git SHA of the commit that triggered this deploy —
      # available as a RUN_TIME env var inside the running nginx container.
      # This is intentionally NOT a Docker build ARG: the SHA must survive
      # image layer caching and remain accurate for every runtime container.
      - key:   DEPLOY_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
      # BUNDLE_VERSION: semantic version injected at both build and run time.
      # Available to the entrypoint script and any runtime tooling.
      - key:   BUNDLE_VERSION
        value: "1.0.0+3467"
        scope: RUN_AND_BUILD_TIME

  # ── 2. AI Gateway — Express.js SSE (Gemini 2.5 Flash Lite) ─────────────────
  - name: ai-gateway
    github:
      repo:           rodrigssousa-sudo/MedCases
      branch:         main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    http_port:       8080
    instance_count:  1
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path:              /health
      initial_delay_seconds:  15
      period_seconds:         30
      timeout_seconds:        5
      success_threshold:      1
      failure_threshold:      3

    routes:
      - path: /api

    envs:
      # ── OBRIGATÓRIA: configurar como SECRET no painel DO ──────────────────
      - key:   GEMINI_API_KEY
        scope: RUN_TIME
        type:  SECRET

      # ── Runtime ───────────────────────────────────────────────────────────
      - key:   PORT
        value: "8080"
        scope: RUN_TIME

      - key:   NODE_ENV
        value: production
        scope: RUN_TIME

      - key:   LOG_LEVEL
        value: info
        scope: RUN_TIME

      - key:   ALLOWED_ORIGIN
        value: https://medcasespro.com
        scope: RUN_TIME
