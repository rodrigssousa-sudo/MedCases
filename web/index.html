<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MedCases Pro — Apoio clínico educacional para médicos e estudantes de medicina.">

  <!-- iOS / Safari PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedCases Pro">
  <meta name="theme-color" content="#07110d">

  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>MedCases Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="1076800980330-mpq75ceph6hipht135qt0g505pdu5u7d.apps.googleusercontent.com">

  <!--
    OTIMIZAÇÃO 1 — Pré-conectar apenas ao que é usado no boot
    gstatic.com = Google Sign-In SDK + Firebase JS
    Sem preconnect para CanvasKit CDN (não usamos mais CanvasKit)
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://accounts.google.com" crossorigin>

  <!--
    OTIMIZAÇÃO 2 — Preload apenas dos recursos críticos do boot
    flutter_bootstrap.js é o único bloqueante real
    main.dart.js é carregado pelo bootstrap — preload paralelo ajuda
  -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!--
    OTIMIZAÇÃO 3 — Google Sign-In com modulepreload + async
    Firebase JS SDK carregado DEPOIS do Flutter (não bloqueia boot)
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!--
    OTIMIZAÇÃO 4 — Firebase via modulepreload condicional
    Carregado apenas depois que o Flutter já renderizou o primeiro frame
    Evita competição de banda com main.dart.js no boot
  -->
  <script>
    // Injeta Firebase SOMENTE após o primeiro frame do Flutter
    function _loadFirebase() {
      var scripts = [
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
        'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js',
      ];
      scripts.forEach(function(src) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        document.head.appendChild(s);
      });
    }
    // Registra para disparar após flutter-first-frame
    window._firebaseScheduled = false;
    function _scheduleFirebase() {
      if (window._firebaseScheduled) return;
      window._firebaseScheduled = true;
      // Pequeno delay para não competir com o paint inicial
      setTimeout(_loadFirebase, 200);
    }
    window.addEventListener('flutter-first-frame', _scheduleFirebase);
    // Fallback: carrega Firebase após 5s mesmo sem evento
    setTimeout(function() { if (!window._firebaseScheduled) _scheduleFirebase(); }, 5000);
  </script>

  <style>
    html, body {
      background-color: #07110d;
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overscroll-behavior: none;
      /* OTIMIZAÇÃO 5 — Evita FOUC e reflow durante o boot */
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #07110d;
      z-index: 9999;
      /* OTIMIZAÇÃO 6 — will-change avisa o browser para criar camada GPU */
      will-change: opacity;
      transition: opacity 0.35s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    #loading-logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #075f45, #07110d);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #loading-logo span { color: #FFE8A6; font-size: 32px; font-weight: 900; font-family: serif; }
    #loading-text { color: #C5A365; font-size: 18px; font-weight: 700; font-family: -apple-system, sans-serif; }
    #loading-sub  { color: rgba(255,255,255,0.4); font-size: 12px; font-family: -apple-system, sans-serif; margin-top: 6px; }
    #loading-spinner {
      margin-top: 32px; width: 32px; height: 32px;
      border: 3px solid rgba(197,163,101,0.2);
      border-top-color: #C5A365;
      border-radius: 50%;
      /* OTIMIZAÇÃO 7 — transform em vez de rotation, GPU-accelerated */
      animation: spin 0.85s linear infinite;
      will-change: transform;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading">
    <div id="loading-logo"><span>M</span></div>
    <div id="loading-text">MedCases Pro</div>
    <div id="loading-sub">Apoio clínico educacional</div>
    <div id="loading-spinner"></div>
  </div>

  <script>
    /*
     * OTIMIZAÇÃO 8 — Estratégia de boot inteligente
     *
     * Fluxo:
     *   a) Se versão == localStorage → SW válido → boot instantâneo do cache
     *   b) Se versão diferente → limpa SW/cache obsoleto → salva nova versão → boot
     *   c) Sem SW → boot direto (não bloqueia em nada)
     *
     * Versão: incrementar a cada deploy para forçar limpeza de cache antigo.
     */
    var APP_VERSION = '3.0.0';

    (function () {

      // ── Remoção do splash ───────────────────────────────────────────────
      var _removed = false;
      function removeLoading() {
        if (_removed) return;
        _removed = true;
        var el = document.getElementById('loading');
        if (!el) return;
        el.classList.add('fade-out');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 380);
      }

      window.addEventListener('flutter-first-frame', removeLoading);

      // MutationObserver como fallback para navegadores que não disparam o evento
      var _obs = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var nodes = mutations[i].addedNodes;
          for (var j = 0; j < nodes.length; j++) {
            var n = nodes[j];
            if (n.tagName) {
              var tag = n.tagName.toLowerCase();
              if (tag === 'flt-glass-pane' || tag === 'flutter-view' || tag === 'flt-scene-host') {
                setTimeout(removeLoading, 150);
                _obs.disconnect();
                return;
              }
            }
          }
        }
      });
      _obs.observe(document.body, { childList: true, subtree: true });

      // Failsafe: remove loading após 15s no pior caso
      setTimeout(function () { if (!_removed) removeLoading(); }, 15000);

      // ── Boot do Flutter ─────────────────────────────────────────────────
      function bootFlutter() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        // OTIMIZAÇÃO 9 — async no bootstrap: browser pode continuar
        // parseando o DOM enquanto baixa (não bloqueia o main thread)
        s.async = true;
        document.head.appendChild(s);
      }

      // Sem suporte a SW → boot direto
      if (!('serviceWorker' in navigator)) {
        bootFlutter();
        return;
      }

      var storedVersion = null;
      try { storedVersion = localStorage.getItem('medcases_app_version'); } catch (e) {}

      if (storedVersion === APP_VERSION) {
        // Cache válido → boot imediato (caminho mais rápido)
        bootFlutter();
        return;
      }

      // Nova versão → limpeza assíncrona não-bloqueante
      var swClean = navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      }).catch(function () {});

      var cacheClean = ('caches' in window)
        ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).catch(function () {})
        : Promise.resolve();

      Promise.all([swClean, cacheClean])
        .catch(function () {})
        .then(function () {
          try { localStorage.setItem('medcases_app_version', APP_VERSION); } catch (e) {}
          bootFlutter();
        });

    }());
  </script>

</body>
</html>
